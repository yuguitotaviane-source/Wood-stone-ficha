<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wood Stone – Job sheet / Ficha de obra</title>
<style>
:root{--bg:#F5F6F7;--ink:#1D2026;--mute:#626873;--line:#D6D9DE;--card:#fff;--brand:#5C1A2B;--warn:#B3261E;--acc:#2F5FA8;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171B;--ink:#E8E9EC;--mute:#9AA0AB;--line:#33363D;--card:#1F2227;--brand:#D58BA0;--warn:#FF8A80;--acc:#8DB2F0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171B;--ink:#E8E9EC;--mute:#9AA0AB;--line:#33363D;--card:#1F2227;--brand:#D58BA0;--warn:#FF8A80;--acc:#8DB2F0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 16px 8px;max-width:980px;margin:auto}
h1{font-size:20px;margin:0;color:var(--brand)}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
main{max-width:980px;margin:auto;padding:8px 16px 40px;display:grid;gap:16px}
@media(min-width:860px){main{grid-template-columns:380px 1fr;align-items:start}#out{position:sticky;top:8px}}
fieldset{border:1px solid var(--line);border-radius:6px;background:var(--card);margin:0 0 12px;padding:10px 12px 4px}
legend{font-weight:700;font-size:13px;color:var(--brand);padding:0 6px}
label{display:block;margin:0 0 10px}
label span{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
input,select{width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:22px;height:22px}
label.miss input,label.miss select{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;font-size:14px;padding:8px 12px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
button.lock{opacity:.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.warn{border-left:4px solid var(--warn);padding:8px 12px;background:var(--card);margin-bottom:10px;font-size:13px}
.svgw{overflow-x:auto}svg{width:100%;height:auto;max-height:520px;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.sw{display:inline-block;width:36px;height:36px;border:1px solid var(--line);vertical-align:middle;margin-right:8px}
.note{font-size:12px;color:var(--mute)}
#wm{position:fixed;inset:0;z-index:-1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;opacity:.16;pointer-events:none}
#wm img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #wm{opacity:.11}}
:root[data-theme="dark"] #wm{opacity:.11}
fieldset,.card,.warn{background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent)}
@media print{#wm{display:none}}
@media print{#form,.bar,header{display:none}main{display:block}}
</style></head><body>

<script>

["Job / Obra",[["client","Client / Cliente","t",0,1,""],["addr","Job site address / Endereço da obra","t",0,1,""],["by","Measured by / Quem mediu","t",0,1,""],["date","Date / Data","d",0,1,""]]],
["Stone / Pedra",[["st","Type / Tipo","s",["Quartz","Granite","Marble","Quartzite"],1,"Quartz"],["sc","Color name / Cor","t",0,1,"Sparkling White"],["th","Thickness / Espessura","s",["3/4\"","1 1/4\""],1,""],["ed","Edge / Borda","s",["Eased","Bevel","Bullnose","Ogee"],1,""]]],
["Cabinets / Gabinetes",[["dm","Door material / Material da porta","s",["Wood","Other"],1,"Wood"],["ds","Door style / Estilo","s",["Shaker","Raised panel","Flat"],1,""],["cc","Color / Cor","s",Object.keys(COL),1,""]]],
["Measurements / Medidas (in)",[["sh","Shape / Formato","s",["L","Straight"],1,"L"],["A","Arm A length (top) / Braço A","n",0,1,"90"],["B","Arm B length (side) / Braço B","n",0,1,"128"],["d","Depth / Profundidade","n",0,1,"25.5"],["ok","Measurements confirmed on site / Medidas confirmadas na obra","c",0,1,""]]],
["Cut-outs / Recortes",[["sm","Sink mount / Montagem da pia","s",["Undermount","Drop-in","Vessel","Farmhouse"],1,""],["sw","Sink width / Largura","n",0,1,""],["sd","Sink depth / Profundidade","n",0,1,""],["so","Sink distance from left end of A / Distância da ponta de A","n",0,1,""],["ra","Range on arm / Fogão no braço","s",["A","B"],1,""],["rw","Range opening width / Largura do vão","n",0,1,""],["ro","Range distance from free end / Distância da ponta livre","n",0,1,""]]],
["Backsplash",[["bs","Backsplash","s",["None","4\"","Full height","Keep existing tile"],1,""]]]];
const F=G.flatMap(g=>g[1]);
const TEST={addr:"123 Example St, Orlando FL (TEST)",by:"Test",th:"1 1/4\"",ed:"Eased",ds:"Shaker",cc:"Dark gray",ok:true,sm:"Undermount",sw:"33",sd:"19",so:"30",ra:"B",rw:"30",ro:"24",bs:"4\""};
const today=new Date().toISOString().slice(0,10);
let V={};try{V=JSON.parse(localStorage.getItem("ws2")||"{}")}catch(e){}
function defaults(){V={};F.forEach(f=>V[f[0]]="")}
if(!Object.keys(V).length)defaults();
let view="draft";
const $=s=>document.querySelector(s),n=id=>parseFloat(V[id]);
$("#form").innerHTML=G.map(([g,fs])=>`<fieldset><legend>${g}</legend>${fs.map(([id,l,t,o,q])=>`<label data-id="${id}"><span>${l}${q?" *":""}</span>${t==="s"?`<select id="${id}"><option value="">–</option>${o.map(x=>`<option>${x}</option>`).join("")}</select>`:`<input id="${id}" type="${t==="c"?"checkbox":t==="n"?"number":t==="d"?"date":"text"}"${t==="n"?' inputmode="decimal" step="0.25" min="0"':""}>`}</label>`).join("")}</fieldset>`).join("")+`<div class="bar"><button type="button" id="reset">Clear all / Limpar tudo</button></div>`;
function load(){F.forEach(([id,,t])=>{const e=$("#"+id);if(t==="c")e.checked=!!V[id];else e.value=V[id]||""})}
function save(){try{localStorage.setItem("ws2",JSON.stringify(V))}catch(e){}}
$("#form").addEventListener("input",e=>{const id=e.target.id;if(!id)return;V[id]=e.target.type==="checkbox"?e.target.checked:e.target.value;save();render()});

$("#reset").onclick=()=>{defaults();load();save();view="draft";render()};
const req=id=>F.find(f=>f[0]===id)[4]&&!(id==="B"&&V.sh==="Straight");
const empty=id=>!V[id];
const missing=()=>F.filter(f=>req(f[0])&&empty(f[0])).map(f=>f[1].split(" / ")[0]);
const L=()=>V.sh!=="Straight";
function dh(x1,x2,y,t,fs){return`<g stroke="currentColor" stroke-width="${fs*.07}"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y-fs*.4}" x2="${x1}" y2="${y+fs*.4}"/><line x1="${x2}" y1="${y-fs*.4}" x2="${x2}" y2="${y+fs*.4}"/></g><text x="${(x1+x2)/2}" y="${y-fs*.5}" text-anchor="middle" font-size="${fs}" fill="currentColor">${t}</text>`}
function dv(y1,y2,x,t,fs){return`<g stroke="currentColor" stroke-width="${fs*.07}"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x-fs*.4}" y1="${y1}" x2="${x+fs*.4}" y2="${y1}"/><line x1="${x-fs*.4}" y1="${y2}" x2="${x+fs*.4}" y2="${y2}"/></g><text transform="translate(${x+fs*1.3} ${(y1+y2)/2}) rotate(-90)" text-anchor="middle" font-size="${fs}" fill="currentColor">${t}</text>`}
const stoneCol=()=>{const s=V.sc||"";return/white/i.test(s)?"#ECECE8":/black/i.test(s)?"#2E2E31":/gr[ae]y/i.test(s)?"#B9BBBE":"#D8D2C8"};
const defs=()=>`<defs><pattern id="sp" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#8a8a8a" opacity=".5"/><circle cx="4" cy="4" r=".4" fill="#aaa" opacity=".6"/></pattern></defs>`;
function plan(){const A=n("A"),d=n("d"),l=L(),B=l?n("B"):d;
if(!(A>0&&d>0&&B>0))return`<p class="note">Enter the measurements. / Informe as medidas.</p>`;
if(l&&(B<d||A<d))return`<p class="note">Arm lengths must be larger than the depth.</p>`;
const fs=Math.max(A,B)/24,p=fs*5,sc=stoneCol();
const path=l?`M0,0H${A}V${B}H${A-d}V${d}H0Z`:`M0,0H${A}V${d}H0Z`;
let s=`<svg viewBox="0 0 ${A+2*p} ${B+2*p}" role="img" aria-label="Plan view">${defs()}<g transform="translate(${p} ${p})"><path d="${path}" fill="${sc}" stroke="currentColor" stroke-width="${fs*.12}"/><path d="${path}" fill="url(#sp)"/>`;
if(n("sw")>0&&n("sd")>0&&V.so!==""&&V.so!=null){const x=n("so"),w=n("sw"),h=n("sd");s+=`<rect x="${x}" y="${(d-h)/2}" width="${w}" height="${h}" rx="${fs*.3}" fill="#5B8BD6" fill-opacity=".35" stroke="#2F5FA8" stroke-dasharray="${fs*.4} ${fs*.3}" stroke-width="${fs*.1}"/><text x="${x+w/2}" y="${d/2+fs*.3}" text-anchor="middle" font-size="${fs*.8}" fill="currentColor">Sink</text>`}
if(V.ra&&n("rw")>0&&V.ro!==""&&V.ro!=null){const w=n("rw"),o=n("ro"),a=V.ra==="A";const x=a?o:A-d,y=a?0:B-o-w,rw=a?w:d,rh=a?d:w;s+=`<rect x="${x}" y="${y}" width="${rw}" height="${rh}" fill="#222" fill-opacity=".85"/><text x="${x+rw/2}" y="${y+rh/2+fs*.3}" text-anchor="middle" font-size="${fs*.8}" fill="#fff">Range</text>`}
s+=dh(0,A,-fs*2,A+'"',fs)+dv(0,d,-fs*2.2,d+'"',fs);if(l)s+=dv(0,B,A+fs*2,B+'"',fs);
return s+`</g></svg>`}
function elev(len,id){if(!(len>0))return"";const t=Math.max(V.th==="3/4\""?.75:1.25,1.5),h=34.5,fs=Math.max(len,45)/26,p=fs*4,k=Math.max(1,Math.round(len/21)),dw=len/k,cc=COL[V.cc]||"#9AA0A8";
let s=`<svg viewBox="0 0 ${len+2*p} ${h+t+2*p}" role="img" aria-label="Elevation ${id}"><g transform="translate(${p} ${p})"><rect x="0" y="${t}" width="${len}" height="${h}" fill="${cc}" stroke="currentColor" stroke-width="${fs*.1}"/>`;
for(let i=0;i<k;i++){const x=i*dw;s+=`<rect x="${x}" y="${t}" width="${dw}" height="${h}" fill="none" stroke="currentColor" stroke-width="${fs*.06}"/>`;if(V.ds&&V.ds!=="Flat")s+=`<rect x="${x+2.5}" y="${t+2.5}" width="${dw-5}" height="${h-5}" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="${fs*.05}"/>`;s+=`<circle cx="${x+(i%2?2:dw-2)+(i%2?3:-3)}" cy="${t+4}" r="${fs*.22}" fill="currentColor"/>`}
if(V.ra===id&&n("rw")>0&&V.ro!==""&&V.ro!=null)s+=`<rect x="${n("ro")}" y="${t}" width="${n("rw")}" height="${h}" fill="#222" fill-opacity=".9"/>`;
s+=`<rect x="${-1}" y="0" width="${len+2}" height="${t}" fill="${stoneCol()}" stroke="currentColor" stroke-width="${fs*.1}"/>`+dh(0,len,-fs*1.6,len+'"',fs)+dv(t,t+h,-fs*1.8,'34.5"',fs);
return s+`</g></svg><p class="note">Elevation ${id}${id==="A"?" / Elevação":" / Elevação"}: door layout is illustrative. / Divisão das portas ilustrativa.</p>`}
const pieces=()=>{const A=n("A"),d=n("d");const p=[[1,A,d]];if(L())p.push([2,+(n("B")-d).toFixed(2),d]);return p};
const area=()=>pieces().reduce((a,p)=>a+p[1]*p[2],0);
const tbl=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`;
function checks(){const c=[],A=n("A"),d=n("d");if(d!==25.5)c.push(`Depth ${d}" differs from the standard 25.5".`);
if(n("so")+n("sw")>A)c.push("Sink goes beyond the end of arm A.");
if(V.ra){const len=V.ra==="A"?A:n("B");if(n("ro")+n("rw")>len)c.push("Range opening goes beyond its arm.")}
return c.length?`<div class="warn">${c.join("<br>")}</div>`:""}
function body(v){const spec=`${V.st} ${V.sc}, ${V.th}, ${V.ed} edge`;
if(v==="client")return`<div class="card"><h2>${V.client}</h2><p>${spec}<br>Cabinets: ${V.dm} doors, ${V.ds}, ${V.cc}<br>Backsplash: ${V.bs}<br>Sink: ${V.sm}</p><p><span class="sw" style="background:${stoneCol()}"></span>${V.sc}<br><span class="sw" style="background:${COL[V.cc]}"></span>${V.cc}</p></div><div class="card svgw">${plan()}${elev(n("A"),"A")}${L()?elev(n("B"),"B"):""}</div><p class="note">Estimate for visualization only. Real stone color and veining vary by slab. / Estimativa para visualização. Cor e veio reais variam por chapa.</p>`;
if(v==="company")return`<div class="card">${checks()}${tbl(["Field","Value"],F.filter(f=>f[2]!=="c").map(f=>[f[1].split(" / ")[0],V[f[0]]||"–"]))}${tbl(["Piece","L x D (in)","sq in"],pieces().map(p=>[p[0],`${p[1]} x ${p[2]}`,(p[1]*p[2]).toFixed(2)]))}<p><b>Total: ${area().toFixed(2)} sq in = ${(area()/144).toFixed(1)} sq ft</b> (no waste)</p></div><div class="card svgw">${plan()}</div>`;
return`<div class="card">${checks()}<p><b>${V.client}</b>: ${spec}</p>${tbl(["Piece","Length","Depth"],pieces().map(p=>[p[0],p[1]+'"',p[2]+'"']))}${tbl(["Cut-out","Size","Position"],[["Sink, "+V.sm,`${V.sw}" x ${V.sd}"`,`${V.so}" from left end of A`],["Range opening, arm "+V.ra,`${V.rw}"`,`${V.ro}" from free end`]])}<p class="note">Seam at the corner between pieces 1 and 2 (assumed). Backsplash: ${V.bs}.</p></div><div class="card svgw">${plan()}</div>`}
function render(){const m=missing();F.forEach(([id])=>{const l=document.querySelector(`label[data-id="${id}"]`);l.classList.toggle("miss",req(id)&&empty(id))});
const tabs=[["draft","Draft"],["client","Client"],["company","Company"],["cutter","Cutter"]];
$("#tabs").innerHTML=tabs.map(([k,t])=>`<button class="${view===k?"on":""} ${k!=="draft"&&m.length?"lock":""}" data-v="${k}">${t}${k!=="draft"&&m.length?" 🔒":""}</button>`).join("")+`<button data-v="print">Save PDF</button>`;
$("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.v;if(k==="print"){try{window.print()}catch(e){}return}view=k;render()});
let h="";if(m.length)h+=`<div class="warn"><b>${m.length} required field${m.length>1?"s":""} missing / campos obrigatórios:</b><br>${m.join(", ")}.<br>Client, Company and Cutter versions unlock when all are filled.</div>`;
if(view!=="draft"&&!m.length)h+=body(view);else h+=`<div class="card svgw"><p class="note">Draft preview / Rascunho${m.length?" – INCOMPLETE / INCOMPLETO":""}</p>${plan()}${elev(n("A"),"A")}${L()?elev(n("B"),"B"):""}</div>`;
$("#view").innerHTML=h}
load();render();
</script></body></html>
